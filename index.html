<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Metronome</title>
    <meta
      name="description"
      content="A metronome with an accent grid, swing, subdivisions and tap tempo. Works offline."
    />
    <meta name="theme-color" content="#f5ead8" />

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Metronome" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
    />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/figtree-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/caprasimo-latin.woff2"
      crossorigin
    />

    <!-- Inline, because it has to land ahead of first paint. The source of
         truth is pwa/theme-boot.js; `node tools/build.mjs --check` fails if
         this copy has drifted from it. -->
    <script>
      (function () {
        var KEY = "metro.theme";
        var GROUND = { light: "#f5ead8", dark: "#1a1714" };
        var ORDER = ["system", "light", "dark"];
        var mq = matchMedia("(prefers-color-scheme: dark)");
        var pref;
        try {
          pref = localStorage.getItem(KEY);
        } catch (e) {}
        if (ORDER.indexOf(pref) < 1) pref = "system";

        function apply() {
          var resolved =
            pref === "system" ? (mq.matches ? "dark" : "light") : pref;
          document.documentElement.setAttribute("data-theme", resolved);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = GROUND[resolved];
          api.pref = pref;
          api.resolved = resolved;
          dispatchEvent(new Event("themechange"));
        }

        var api = (window.__theme = {
          pref: pref,
          resolved: "light",
          order: ORDER,
          set: function (p) {
            pref = ORDER.indexOf(p) < 0 ? "system" : p;
            try {
              if (pref === "system") localStorage.removeItem(KEY);
              else localStorage.setItem(KEY, pref);
            } catch (e) {}
            apply();
          },
          cycle: function () {
            api.set(ORDER[(ORDER.indexOf(pref) + 1) % ORDER.length]);
          },
        });

        /* An explicit Light or Dark outranks the OS; only 'system' tracks it. */
        mq.addEventListener("change", function () {
          if (pref === "system") apply();
        });
        apply();
      })();
    </script>

    <link rel="stylesheet" href="ds/styles.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/app.css" />

    <!-- Registration runs during parse, so the worker is already being checked
         while the module graph is still loading. -->
    <script src="pwa/register.js"></script>
    <script type="module" src="ui/main.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
