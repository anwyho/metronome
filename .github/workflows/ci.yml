name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # puppeteer's postinstall downloads full Chrome AND chrome-headless-shell
      # by default; this job needs neither.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - run: npm run test:unit

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Skip postinstall's default download of both browsers, then fetch only
      # the one this job needs: full Chrome, not chrome-headless-shell, which
      # has no service worker implementation and the worker is half of what
      # these specs cover.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npx puppeteer browsers install chrome
      - run: npm run build
      - run: npm run test:browser

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: bash tools/build-site.sh
